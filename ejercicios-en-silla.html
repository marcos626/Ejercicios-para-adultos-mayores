<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2E7D4F">
<title>Ejercicios en silla</title>
<style>
  :root { --txt:#1d2329; --sub:#55606b; --bg:#f6f4ef; --card:#ffffff; --line:#e3ded4; --ok:#2E7D4F; --mod:#2E7D4F; --modc:#E3F2E8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--txt); font-family:-apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size:20px; line-height:1.4; }
  .wrap { max-width:560px; margin:0 auto; padding:16px 16px 40px; }
  h1 { font-size:1.6rem; margin:.2rem 0 .6rem; }
  h2 { font-size:1.3rem; margin:.4rem 0 .5rem; }
  p { margin:.4rem 0; }
  .sub { color:var(--sub); font-size:.95rem; }
  button { font:inherit; border:0; border-radius:16px; cursor:pointer; }
  .big { display:block; width:100%; padding:20px 18px; font-size:1.25rem; font-weight:700; color:#fff; background:var(--mod); margin:12px 0; }
  .big.sec { background:#fff; color:var(--txt); border:2px solid var(--line); font-weight:600; }
  .big:active { transform:scale(.99); }
  .who { display:flex; flex-direction:column; gap:16px; margin-top:24px; }
  .who button { padding:34px 18px; font-size:1.7rem; font-weight:800; color:#fff; }
  .card { background:var(--card); border-radius:20px; padding:18px; margin:14px 0; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .next { border-left:10px solid var(--mod); }
  .tag { display:inline-block; padding:3px 12px; border-radius:999px; font-size:.85rem; font-weight:700; color:#fff; background:var(--mod); }
  .week { margin:18px 0 6px; font-weight:700; font-size:1rem; display:flex; justify-content:space-between; align-items:baseline; }
  .grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px; }
  .day { aspect-ratio:1; border-radius:12px; background:#fff; border:2px solid var(--line); font-size:1.05rem; font-weight:700; color:var(--txt); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0; }
  .day small { font-size:.62rem; font-weight:600; line-height:1; margin-top:2px; }
  .day.done { color:#fff; }
  .day.sug { outline:4px solid #f2b705; outline-offset:1px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .link { background:none; color:var(--sub); text-decoration:underline; padding:8px 0; font-size:.95rem; }
  .bar { height:12px; background:#e6e1d7; border-radius:999px; overflow:hidden; margin:6px 0 12px; }
  .bar > div { height:100%; background:var(--mod); }
  .ex img { width:100%; max-height:34vh; object-fit:contain; background:#fff; border-radius:14px; }
  .dose { background:var(--modc); border-radius:14px; padding:12px 14px; font-size:1.2rem; font-weight:700; margin:12px 0; }
  ol.steps { padding-left:1.3em; margin:.4rem 0; }
  ol.steps li { margin:.45rem 0; }
  .var { border-top:1px dashed var(--line); margin-top:12px; padding-top:10px; color:var(--sub); font-size:.95rem; }
  .nav { display:flex; gap:12px; position:sticky; bottom:0; background:linear-gradient(to top, var(--bg) 75%, rgba(246,244,239,0)); padding:14px 0 8px; }
  .nav button { flex:1; padding:20px 10px; font-size:1.2rem; font-weight:700; }
  .nav .prev { background:#fff; border:2px solid var(--line); color:var(--txt); flex:.6; }
  .nav .fwd { background:var(--mod); color:#fff; }
  .timer { font-size:3.4rem; font-weight:800; text-align:center; font-variant-numeric:tabular-nums; margin:8px 0; }
  .warn { background:#fff4d6; border-left:8px solid #f2b705; border-radius:12px; padding:12px 14px; font-size:1rem; margin:12px 0; }
  ul.plain { padding-left:1.2em; margin:.3rem 0; }
  ul.plain li { margin:.35rem 0; }
  textarea { width:100%; min-height:140px; font-size:.8rem; border-radius:12px; border:2px solid var(--line); padding:10px; }
  .hist { font-size:.95rem; color:var(--sub); }
  .center { text-align:center; }
</style>
</head>

const PERSONAS = [{ id: "mingo", nombre: "Mingo", color: "#2B6CB0" }, { id: "choly", nombre: "Choly", color: "#B83280" }];
const KEY = "ejercicios-silla-v1";

// ---------- guardado en el celular ----------
let storageOk = true;
function loadAll() {
  try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : {}; }
  catch (e) { storageOk = false; return mem; }
}
let mem = {};
function saveAll(d) {
  mem = d;
  try { localStorage.setItem(KEY, JSON.stringify(d)); storageOk = true; } catch (e) { storageOk = false; }
}
function prog(pid) { const d = loadAll(); return (d[pid] = d[pid] || { dias: {} }); }
function marcarDia(pid, dia) {
  const d = loadAll(); d[pid] = d[pid] || { dias: {} };
  const r = d[pid].dias[dia] || { veces: 0, fechas: [] };
  r.veces += 1; r.fechas.push(hoy()); r.fechas = r.fechas.slice(-20);
  d[pid].dias[dia] = r; saveAll(d);
}

function hoy() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

// ---------- plan ----------
function modDeDia(dia) { return MODULOS[Math.floor((dia - 1) / 7)]; }
function kDeDia(dia) { return (dia - 1) % 7; }
function dosisTexto(ds, k) {
  const mid = Math.round((ds.lo + ds.hi) / 2);
  const v = k <= 2 ? ds.lo : (k <= 4 ? mid : ds.hi);
  const series = k <= 3 ? 1 : 2;
  const lado = ds.lado ? " con cada lado" : "";
  if (ds.tipo === "reps") {
    let t = (series === 1 ? "1 serie" : "2 series") + " de " + v + " repeticiones" + lado;
    if (series === 2) t += ", con un descanso corto entre series";
    if (ds.nota) t += " (" + ds.nota + ")";
    return t;
  }
  if (ds.tipo === "seg") return "Sostener " + v + " segundos, " + ds.veces + " veces" + (ds.lado ? " de cada lado" : "");
  return "Durante " + v + " segundos";
}
function pasosSesion(dia) {
  const m = modDeDia(dia), k = kDeDia(dia), w = Math.floor((dia - 1) / 7);
  const s = [];
  s.push({ tipo: "bici", min: BICI_MIN });
  CALENTAMIENTO.forEach((c, i) => s.push({ tipo: "calent", c, i }));
  m.ejercicios.forEach(e => s.push({ tipo: "ej", e, dosis: dosisTexto(e.dosis, k) }));
  s.push({ tipo: "calma" });
  return s;
}
function diaSugerido(pid) {
  const p = prog(pid);
  for (let d = 1; d <= 28; d++) if (!p.dias[d]) return d;
  return 28;
}

// ---------- estado y vistas ----------
let st = { vista: "quien", pid: null, dia: null, paso: 0 };
let timer = { restante: 0, id: null, corriendo: false };
const app = document.getElementById("app");
function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function setMod(m) { document.documentElement.style.setProperty("--mod", m.color); document.documentElement.style.setProperty("--modc", m.claro); }
function persona() { return PERSONAS.find(p => p.id === st.pid); }
function go(v, extra) { pararTimer(); Object.assign(st, { vista: v }, extra || {}); render(); window.scrollTo(0, 0); }

function render() {
  if (st.vista === "quien") return vQuien();
  if (st.vista === "inicio") return vInicio();
  if (st.vista === "previa") return vPrevia();
  if (st.vista === "sesion") return vSesion();
  if (st.vista === "fin") return vFin();
  if (st.vista === "copia") return vCopia();
}

function vQuien() {
  setMod(MODULOS[0]);
  app.innerHTML = `<h1 class="center">Ejercicios en silla</h1>
    <p class="center sub">¿Quién va a hacer ejercicio?</p>
    <div class="who">${PERSONAS.map(p => `<button style="background:${p.color}" data-p="${p.id}">${p.nombre}</button>`).join("")}</div>
    ${storageOk ? "" : `<div class="warn">Este navegador no permite guardar el progreso. Los ejercicios se pueden hacer igual.</div>`}`;
  app.querySelectorAll("[data-p]").forEach(b => b.onclick = () => go("inicio", { pid: b.dataset.p }));
}

function vInicio() {
  const p = prog(st.pid), sug = diaSugerido(st.pid), m = modDeDia(sug);
  setMod(m);
  const hechos = Object.keys(p.dias).length;
  let semanas = "";
  MODULOS.forEach((mod, w) => {
    let celdas = "";
    for (let k = 0; k < 7; k++) {
      const d = w * 7 + k + 1, r = p.dias[d];
      const cls = "day" + (r ? " done" : "") + (d === sug && !r ? " sug" : "");
      const sty = r ? `background:${mod.color};border-color:${mod.color}` : `border-color:${mod.claro}`;
      celdas += `<button class="${cls}" style="${sty}" data-d="${d}">${d}${r ? `<small>${r.veces === 1 ? "hecho" : r.veces + " veces"}</small>` : ""}</button>`;
    }
    semanas += `<div class="week"><span style="color:${mod.color}">Semana ${w + 1} · ${mod.nombre}</span></div><div class="grid">${celdas}</div>`;
  });
  app.innerHTML = `<div class="top"><h1>Hola, ${esc(persona().nombre)}</h1><button class="link" id="cambiar">Cambiar</button></div>
    <div class="card next"><span class="tag">${m.nombre}</span>
      <h2>Día ${sug} de 28</h2><p class="sub">${esc(m.intro)}</p>
      <button class="big" id="empezar">Empezar el día ${sug}</button></div>
    <p class="sub">Días completados: <b>${hechos} de 28</b>. Puede tocar cualquier día para hacerlo o repetirlo.</p>
    ${semanas}
    <p style="margin-top:22px"><button class="link" id="copia">Copia de seguridad del progreso</button></p>`;
  app.querySelector("#cambiar").onclick = () => go("quien");
  app.querySelector("#empezar").onclick = () => go("previa", { dia: sug });
  app.querySelector("#copia").onclick = () => go("copia");
  app.querySelectorAll("[data-d]").forEach(b => b.onclick = () => go("previa", { dia: +b.dataset.d }));
}

function vPrevia() {
  const m = modDeDia(st.dia), k = kDeDia(st.dia), w = Math.floor((st.dia - 1) / 7);
  setMod(m);
  const r = prog(st.pid).dias[st.dia];
  app.innerHTML = `<div class="top"><button class="link" id="volver">Volver</button><span class="tag">${m.nombre}</span></div>
    <h1>Día ${st.dia}</h1>
    ${r ? `<p class="hist">Ya lo hizo ${r.veces === 1 ? "1 vez" : r.veces + " veces"} (última: ${fmt(r.fechas[r.fechas.length - 1])}).</p>` : ""}
    ${m.aviso ? `<div class="warn">${esc(m.aviso)}</div>` : ""}
    <div class="card"><h2>Hoy va a hacer</h2>
      <ul class="plain">
        <li><b>Bici fija:</b> ${BICI_MIN} minutos, suave</li>
        <li><b>Calentamiento:</b> ${CALENTAMIENTO.length} movimientos sentado</li>
        ${m.ejercicios.map(e => `<li>${esc(e.nombre)}</li>`).join("")}
        <li><b>Vuelta a la calma:</b> respiración</li>
      </ul>
      <p class="sub">Tenga a mano la silla firme, la pelota y un vaso de agua.</p></div>
    <button class="big" id="go">Comenzar</button>`;
  app.querySelector("#volver").onclick = () => go("inicio");
  app.querySelector("#go").onclick = () => go("sesion", { paso: 0 });
}

function fmt(iso) { if (!iso) return ""; const [y, mo, d] = iso.split("-"); return d + "/" + mo; }

function vSesion() {
  const m = modDeDia(st.dia); setMod(m);
  const pasos = pasosSesion(st.dia), p = pasos[st.paso], n = pasos.length;
  let cuerpo = "";
  if (p.tipo === "bici") {
    if (!timer.corriendo && timer.restante === 0) timer.restante = p.min * 60;
    cuerpo = `<h1>Bici fija</h1>
      <div class="dose">Hoy: ${p.min} minutos, pedaleando suave</div>
      <div class="card"><div class="timer" id="t">${mmss(timer.restante)}</div>
        <button class="big" id="tbtn">${timer.corriendo ? "Pausar" : (timer.restante < p.min * 60 ? "Seguir" : "Empezar a pedalear")}</button>
        <p class="sub">Con poca resistencia. Debe poder hablar mientras pedalea. Si se cansa, baje el ritmo o pare.</p></div>`;
  } else if (p.tipo === "calent") {
    const c = p.c;
    cuerpo = `<p class="sub" style="margin:0">Calentamiento ${p.i + 1} de ${CALENTAMIENTO.length}</p><h1>${esc(c.nombre)}</h1>
      <div class="card ex"><img src="${IMGS[c.img]}" alt="${esc(c.nombre)}">
        <div class="dose">${esc(c.dosis)}</div>
        <ol class="steps">${c.pasos.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>`;
  } else if (p.tipo === "ej") {
    const e = p.e;
    cuerpo = `<p class="sub" style="margin:0">${m.nombre}</p><h1>${esc(e.nombre)}</h1>
      ${e.ayuda ? `<div class="warn">Hacer este ejercicio con la enfermera al lado.</div>` : ""}
      <div class="card ex"><img src="${IMGS[e.img]}" alt="${esc(e.nombre)}">
        <div class="dose">Hoy: ${esc(p.dosis)}</div>
        <ol class="steps">${e.pasos.map(x => `<li>${esc(x)}</li>`).join("")}</ol>
        ${e.variante ? `<div class="var"><b>Variante:</b> ${esc(e.variante)}</div>` : ""}</div>`;
  } else {
    cuerpo = `<h1>Vuelta a la calma</h1><div class="dose">Hoy: 10 respiraciones lentas</div>
      <div class="card"><ol class="steps">
        <li>Siéntese cómodo y cierre los ojos.</li>
        <li>Tome aire despacio por la nariz, llenando bien los pulmones.</li>
        <li>Suéltelo despacio por la boca.</li>
        <li>Al terminar, quédese un ratito tranquilo y tome agua.</li></ol></div>`;
  }
  const ult = st.paso === n - 1;
  app.innerHTML = `<div class="top"><button class="link" id="salir">Salir</button><span class="sub">Paso ${st.paso + 1} de ${n}</span></div>
    <div class="bar"><div style="width:${((st.paso + 1) / n) * 100}%"></div></div>
    ${cuerpo}
    <div class="nav">${st.paso > 0 ? `<button class="prev" id="ant">Atrás</button>` : ""}
      <button class="fwd" id="sig">${ult ? "Terminé" : "Siguiente"}</button></div>`;
  app.querySelector("#salir").onclick = () => { timer.restante = 0; go("inicio"); };
  const ant = app.querySelector("#ant"); if (ant) ant.onclick = () => { pararTimer(); st.paso--; render(); window.scrollTo(0, 0); };
  app.querySelector("#sig").onclick = () => {
    pararTimer(); timer.restante = 0;
    if (ult) { marcarDia(st.pid, st.dia); go("fin"); } else { st.paso++; render(); window.scrollTo(0, 0); }
  };
  const tb = app.querySelector("#tbtn");
  if (tb) tb.onclick = () => { timer.corriendo ? pararTimer() : arrancarTimer(); render(); };
}
function mmss(s) { const m = Math.floor(s / 60), r = s % 60; return m + ":" + String(r).padStart(2, "0"); }
function arrancarTimer() {
  if (timer.restante <= 0) return;
  timer.corriendo = true;
  const fin = Date.now() + timer.restante * 1000;
  timer.id = setInterval(() => {
    timer.restante = Math.max(0, Math.round((fin - Date.now()) / 1000));
    const t = document.getElementById("t"); if (t) t.textContent = mmss(timer.restante);
    if (timer.restante === 0) { pararTimer(); try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {} render(); }
  }, 250);
}
function pararTimer() { if (timer.id) clearInterval(timer.id); timer.id = null; timer.corriendo = false; }

function vFin() {
  const m = modDeDia(st.dia); setMod(m);
  const sig = Math.min(28, st.dia + 1);
  app.innerHTML = `<div class="card center" style="margin-top:30px"><h1>¡Muy bien, ${esc(persona().nombre)}!</h1>
      <p>Terminó el día ${st.dia}. Quedó guardado en este celular.</p>
      ${st.dia < 28 ? `<p class="sub">La próxima vez sigue con el día ${sig}${modDeDia(sig) !== m ? " (" + modDeDia(sig).nombre + ")" : ""}.</p>` : `<p>¡Completó los 28 días! Puede volver a empezar o repetir el módulo que más le guste.</p>`}</div>
    <button class="big" id="ok">Volver al inicio</button>
    ${storageOk ? "" : `<div class="warn">Atención: este navegador no permitió guardar el progreso.</div>`}`;
  app.querySelector("#ok").onclick = () => go("inicio");
}

function vCopia() {
  const data = JSON.stringify(loadAll());
  app.innerHTML = `<div class="top"><button class="link" id="volver">Volver</button></div>
    <h1>Copia de seguridad</h1>
    <p class="sub">El progreso de Mingo y Choly se guarda solo en este celular. Para no perderlo si se borran los datos del navegador o se cambia de teléfono, guarde una copia.</p>
    <button class="big" id="copiar">Copiar el texto de la copia</button>
    ${window.self === window.top ? `<button class="big sec" id="bajar">Descargar copia como archivo</button>` : ""}
    <p class="sub">Pegue el texto copiado en un mensaje de WhatsApp para usted mismo o en una nota. Si el navegador no permite descargar, use el botón de copiar.</p>
    <textarea id="txt" readonly>${esc(data)}</textarea>
    <h2 style="margin-top:22px">Recuperar una copia</h2>
    <p class="sub">Pegue acá el texto de una copia y toque Recuperar. Reemplaza el progreso actual.</p>
    <textarea id="imp" placeholder="Pegue aquí el texto de la copia"></textarea>
    <button class="big sec" id="rec">Recuperar</button>
    <p class="sub" id="msg"></p>`;
  app.querySelector("#volver").onclick = () => go("inicio");
  const bj = app.querySelector("#bajar");
  if (bj) bj.onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
    a.download = "ejercicios-progreso-" + hoy() + ".json";
    try { a.click(); } catch (e) { app.querySelector("#msg").textContent = "No se pudo descargar. Use el botón de copiar."; }
  };
  app.querySelector("#copiar").onclick = async () => {
    const msg = app.querySelector("#msg");
    try { await navigator.clipboard.writeText(data); msg.textContent = "Copiado."; }
    catch (e) { const t = app.querySelector("#txt"); t.select(); msg.textContent = "Seleccione el texto y cópielo."; }
  };
  app.querySelector("#rec").onclick = () => {
    const msg = app.querySelector("#msg");
    try { const d = JSON.parse(app.querySelector("#imp").value); if (typeof d !== "object" || !d) throw 0; saveAll(d); msg.textContent = "Listo, progreso recuperado."; }
    catch (e) { msg.textContent = "El texto no es una copia válida."; }
  };
}

loadAll(); render();
</script>
</body>
</html>
